[build-system]
requires = ["setuptools>=61", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "onithrasML"
version = "0.1.1"
description = "Machine learning algorithms implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pybind11"
]

[tool.setuptools.packages.find]
where = ["src"]