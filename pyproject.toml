[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "onithrasML"
version = "0.2.6"
description = "Machine learning algorithms implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pybind11"
]

[tool.maturin]
manifest-path = "crates/onithrasml-python/Cargo.toml"
python-source = "python/src"
module-name = "onithrasML._backend._native"
bindings = "pyo3"